<html lang="hi" data-lang="hi">
<head>
<meta charset="UTF-8">

<meta property="og:type" content="website">
<meta property="og:title" content="Aarushi & Ajeet — शुभ विवाह निमंत्रण">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff4f93;--pink2:#ff8fbd;--blush:#ffd9e8;--rose:#c2185b;--ink:#2b0d1b;--gold:#f2cf8e;--ls:.28em;
  --f-body:'Poppins',sans-serif;
  --f-disp:'Cormorant Garamond','Tiro Devanagari Hindi',serif;
  --f-script:'Great Vibes','Tiro Devanagari Hindi',cursive;
}
html[data-lang="hi"]{--ls:.02em;--f-disp:'Tiro Devanagari Hindi',serif;--f-script:'Tiro Devanagari Hindi',serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--f-body);color:#fff;background:#0b0509;line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
img{max-width:100%}
button{font:inherit}
main{transition:opacity .22s}
.ls{letter-spacing:var(--ls)}

/* ===== Background: black + white + pink gradient ===== */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(165deg,#06050a 0%,#1a0712 36%,#4a1030 68%,#0a0408 100%)}
.bg i{position:absolute;border-radius:50%;will-change:transform}
.bg i:nth-child(1){width:90vmax;height:90vmax;left:-35vmax;top:-30vmax;background:radial-gradient(circle,rgba(255,61,139,.7),transparent 62%);animation:d1 24s ease-in-out infinite alternate}
.bg i:nth-child(2){width:75vmax;height:75vmax;right:-30vmax;top:20vh;background:radial-gradient(circle,rgba(255,255,255,.32),transparent 62%);animation:d2 30s ease-in-out infinite alternate}
.bg i:nth-child(3){width:85vmax;height:85vmax;left:-10vmax;bottom:-45vmax;background:radial-gradient(circle,rgba(255,143,189,.6),transparent 62%);animation:d3 27s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.6) 100%)}
@keyframes d1{to{transform:translate(18vmax,14vmax)}}
@keyframes d2{to{transform:translate(-16vmax,-10vmax)}}
@keyframes d3{to{transform:translate(14vmax,-12vmax)}}
#petals{position:fixed;inset:0;z-index:101;pointer-events:none}

/* ===== Floating buttons ===== */
.fab{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));z-index:120}
#langBtn{left:10px;display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(20,6,13,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:.6rem;line-height:1.2;cursor:pointer;box-shadow:0 2px 10px rgba(255,79,147,.3)}
#langBtn span{font-size:.7rem}
body.lock #langBtn{display:none}
#musicBtn{right:10px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(20,6,13,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:.75rem;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(255,79,147,.3);display:none}
body:not(.lock) #musicBtn{display:grid;place-items:center}
#musicBtn.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pink);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}

/* ===== Front page (full-screen video, tap to open) ===== */
#env{position:fixed;inset:0;z-index:150;background:#06050a;transition:opacity 1.2s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
#env.done{opacity:0;pointer-events:none}
#env.novid{background:radial-gradient(circle at 50% 42%,#c2185b,#1a0712 55%,#06050a)}
#env video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ===== Generic ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;border:0;cursor:pointer;color:#fff;font-weight:500;font-size:.95rem;text-decoration:none;background:linear-gradient(135deg,#ff4f93,#ff8fbd);box-shadow:0 10px 30px rgba(255,79,147,.45);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 40px rgba(255,79,147,.6)}
.btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);box-shadow:none}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.sec{max-width:1100px;margin:auto;padding:84px 18px}
.eyebrow{text-align:center;color:var(--pink2);font-size:.74rem;text-transform:uppercase;letter-spacing:var(--ls)}
.h2{font-family:var(--f-disp);font-weight:600;font-size:clamp(2rem,6.4vw,3.3rem);text-align:center;line-height:1.25;margin:.25em 0 .1em;text-shadow:0 0 30px rgba(255,79,147,.45)}
.orn{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--pink2);margin:10px auto 40px;max-width:320px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--pink2),transparent)}
.rv{opacity:0;translate:0 34px;transition:opacity .9s ease,translate .9s ease;transition-delay:var(--d,0s)}
.rv.in{opacity:1;translate:0 0}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* ===== Hero ===== */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:70px 18px 100px}
.hero-in>*{opacity:0}
body.go .hero-in>*{animation:up 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*.16s + .15s)}
.hero-top{font-family:var(--f-disp);color:var(--gold);font-size:clamp(1rem,3.4vw,1.35rem)}
.names{font-family:var(--f-script);font-weight:400;line-height:1.05;font-size:clamp(3.4rem,15vw,7.4rem);margin:.15em 0;text-shadow:0 0 40px rgba(255,79,147,.6),0 4px 18px rgba(0,0,0,.5)}
html[data-lang="hi"] .names{line-height:1.3}
.names span,.names em{display:block}
.names em{font-style:normal;color:var(--pink2);font-size:.5em;line-height:1.1}
@media(min-width:800px){.names span,.names em{display:inline-block}.names em{margin:0 .35em}}
.hero-sub{color:var(--blush);font-style:italic;max-width:520px;margin:6px auto 18px}
.hero-date{font-family:var(--f-disp);font-size:clamp(1.15rem,4vw,1.6rem)}
.cd{display:flex;gap:10px;justify-content:center;margin:26px 0 6px}
.cd div{min-width:68px;padding:12px 6px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cd b{display:block;font-family:var(--f-disp);font-size:1.8rem;font-weight:700;line-height:1.2}
.cd small{font-size:.68rem;color:var(--blush);letter-spacing:var(--ls)}
.cd-done{color:var(--gold);font-size:1.2rem;margin-top:22px}
.cue{display:inline-block;margin-top:34px;color:var(--blush);text-decoration:none;font-size:.8rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}

/* ===== Gallery ===== */
.frame{position:relative;margin:0;overflow:hidden;cursor:zoom-in;background:linear-gradient(135deg,#ffd9e8,#ff8fbd)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;transition:transform .9s}
.frame:hover img{transform:scale(1.08)}
.frame .ph{display:none;position:absolute;inset:0;place-items:center;align-content:center;font-size:2.4rem;text-align:center;color:#fff;cursor:default}
.frame .ph small{display:block;font-size:.75rem;letter-spacing:.1em}
.frame.missing img{display:none}
.frame.missing .ph{display:grid}
.rects{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:800px){.rects{grid-template-columns:repeat(4,1fr);gap:24px}}
.rect{aspect-ratio:3/4;border-radius:18px;border:5px solid #fff;box-shadow:0 14px 40px rgba(255,79,147,.4);transform:rotate(var(--r,0deg)) translateY(var(--y,0));transition:transform .5s,box-shadow .5s}
.cell:nth-child(1) .rect{--r:-2deg}
.cell:nth-child(2) .rect{--r:1.5deg;--y:18px}
.cell:nth-child(3) .rect{--r:-1.5deg}
.cell:nth-child(4) .rect{--r:2deg;--y:18px}
.rect:hover{transform:rotate(0) translateY(-6px) scale(1.03);box-shadow:0 22px 55px rgba(255,79,147,.65)}
.rounds{display:grid;grid-template-columns:1fr 1fr;gap:34px 22px;justify-items:center;margin:74px auto 0;max-width:900px}
.r-wrap{position:relative;width:min(42vw,200px)}
.r-wrap:first-child{grid-column:1/-1;width:min(66vw,300px)}
.r-wrap::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px dashed rgba(255,209,227,.8);pointer-events:none}
.r-wrap::after{content:"❀";color:var(--pink2);position:absolute;top:-26px;left:50%;translate:-50% 0;font-size:1.3rem;filter:drop-shadow(0 0 8px rgba(255,79,147,.9))}
.round{aspect-ratio:1;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 3px var(--pink),0 0 0 10px rgba(255,255,255,.16),0 18px 50px rgba(255,79,147,.5)}
.round::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 35%);pointer-events:none}
@media(min-width:800px){
  .rounds{grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:44px}
  .r-wrap,.r-wrap:first-child{width:100%}
  .r-wrap:first-child{grid-column:auto;order:2}
}

/* ===== Video ===== */
.video-box{position:relative;max-width:860px;margin:auto;aspect-ratio:16/9;border-radius:24px;overflow:hidden;border:5px solid #fff;background:linear-gradient(135deg,#3a0f26,#ff4f93);box-shadow:0 20px 60px rgba(255,79,147,.45)}
.video-box video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.vph{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:20px;font-size:1.1rem}
.video-box.missing video{display:none}
.video-box.missing .vph{display:grid}

/* ===== Invitation card ===== */
.card{position:relative;max-width:700px;margin:auto;text-align:center;color:var(--ink);padding:54px 26px;border-radius:30px;background:linear-gradient(180deg,#fff,#fff0f6);box-shadow:0 24px 70px rgba(255,79,147,.45);outline:1.5px solid rgba(255,79,147,.45);outline-offset:-14px}
.card::before,.card::after{content:"❀";position:absolute;font-size:1.6rem;color:var(--pink)}
.card::before{top:18px;left:24px}.card::after{bottom:18px;right:24px}
.inv-head{font-family:var(--f-disp);font-weight:700;color:var(--rose);font-size:clamp(1.4rem,5vw,2rem);margin-bottom:14px}
.card p{font-size:1.02rem}
.card .big{font-family:var(--f-script);font-weight:400;color:var(--rose);font-size:clamp(2.6rem,10vw,4rem);line-height:1.3;margin:.1em 0}
.card .par{color:#6b3a52;font-size:.95rem;margin-bottom:10px}
.card .mid{font-family:var(--f-disp);font-size:1.3rem;font-weight:600;margin:12px 0 4px}
.card .orn{color:var(--pink);margin:22px auto}
.card .orn::before,.card .orn::after{background:linear-gradient(90deg,transparent,var(--pink),transparent)}
.card .bless{font-style:italic;color:#6b3a52}

/* ===== Scratch card (pink) ===== */
.scratch{position:relative;width:min(90vw,380px);height:240px;margin:0 auto;border-radius:28px;padding:2px;background:linear-gradient(145deg,#ff8fbd,#fff,#ff4f93);box-shadow:0 20px 60px rgba(255,79,147,.45)}
.scratch-inner{position:absolute;inset:2px;border-radius:26px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink);background:linear-gradient(160deg,#fff,#ffe3ef)}
.reveal-date{font-family:var(--f-disp);font-weight:700;font-size:clamp(2rem,9vw,2.9rem);line-height:1.2;color:var(--rose)}
.reveal-day{margin-top:8px;color:var(--pink);font-size:.8rem;letter-spacing:var(--ls);text-transform:uppercase}
#scratchCv{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);border-radius:26px;touch-action:none;cursor:crosshair;transition:opacity .9s}
.scratch.done #scratchCv{opacity:0;pointer-events:none}
.scratch-ov{position:absolute;inset:2px;display:grid;place-content:center;text-align:center;color:#fff;pointer-events:none;transition:opacity .4s;text-shadow:0 2px 10px rgba(150,10,70,.6)}
.scratch-ov .big{font-family:var(--f-disp);font-size:1.6rem;font-weight:700}
.scratch-ov small{display:block;font-size:.72rem;opacity:.9;margin-top:4px}
.scratch.started .scratch-ov,.scratch.done .scratch-ov{opacity:0}

/* ===== Details ===== */
.det-grid{display:grid;gap:16px;grid-template-columns:1fr;max-width:960px;margin:auto}
@media(min-width:760px){.det-grid{grid-template-columns:repeat(3,1fr)}}
.det{text-align:center;color:var(--ink);padding:28px 20px;border-radius:22px;border-top:4px solid var(--pink);background:rgba(255,255,255,.95);box-shadow:0 12px 36px rgba(255,79,147,.3)}
.det .ic{display:block;line-height:0;margin-bottom:8px}
.det h4{font-family:var(--f-disp);color:var(--rose);font-size:1.3rem;margin:.1em 0 .2em}
.fam{text-align:center;max-width:560px;margin:34px auto 0;font-family:var(--f-disp);font-size:1.3rem;color:var(--blush)}

/* ===== Gita ===== */
.gita{position:relative;max-width:760px;margin:auto;padding:40px 22px 30px;text-align:center;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,79,147,.13));border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(255,79,147,.28)}
.slide{display:none}
.slide.on{display:block;animation:fadein .9s both}
.sk{font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(1.25rem,4.6vw,1.9rem);line-height:1.9;white-space:pre-line;text-shadow:0 0 22px rgba(255,150,200,.65)}
.gref{margin:16px 0 8px;color:var(--gold);font-size:.82rem;letter-spacing:var(--ls)}
.gm{color:var(--blush);max-width:560px;margin:auto}
.gnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:24px}
.gnav button.ar{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);color:#fff;font-size:1.2rem;cursor:pointer}
.dot{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.35);border:0;padding:0;cursor:pointer;transition:.3s}
.dot.on{background:var(--pink);width:26px}

/* ===== Wishes ===== */
.wsub{text-align:center;color:var(--blush);margin:-18px auto 38px;max-width:520px}
.wgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.wgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.wgrid{grid-template-columns:repeat(3,1fr)}}
.wish{position:relative;overflow:hidden;color:var(--ink);padding:24px 22px 24px 26px;border-radius:20px;background:rgba(255,255,255,.95);box-shadow:0 12px 34px rgba(0,0,0,.35)}
.wish::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--pink),var(--pink2))}
.wish i{color:var(--pink);display:block;font-style:normal;font-size:1.8rem;margin-bottom:4px}

/* ===== Footer ===== */
footer{padding:50px 18px 90px;text-align:center}
.host{max-width:520px;margin:20px auto;padding:28px 22px;border-radius:24px;color:var(--ink);background:rgba(255,255,255,.95);box-shadow:0 16px 46px rgba(255,79,147,.35)}
.host h3{font-family:var(--f-disp);color:var(--rose);font-size:1.5rem}
.host a{color:var(--rose);font-weight:500;text-decoration:none}
.foot-msg{font-family:var(--f-disp);font-size:1.3rem;color:var(--blush);margin-top:26px}
.made{margin-top:18px;color:var(--blush);font-size:.85rem;line-height:1.9}
.made a{color:#fff;font-weight:600;text-decoration:none;border-bottom:1px dashed var(--pink2)}

/* ===== Lightbox ===== */
.lb{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(5,2,4,.92);cursor:zoom-out}
.lb img{max-height:90vh;border-radius:14px;border:4px solid #fff;box-shadow:0 0 60px rgba(255,79,147,.5)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero-in>*{opacity:1}.rv{opacity:1;translate:none}}
</style>
</head>
<body class="lock">

<div class="bg"><i></i><i></i><i></i></div>
<canvas id="petals"></canvas>

<!-- ===== Language + Music buttons ===== -->
<button id="langBtn" class="fab" aria-label="Change language / भाषा बदलें"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3 3 16.5 0 19M12 2.5c-3 3-3 16.5 0 19"/></svg><i id="langLbl" style="font-style:normal"></i></button>
<button id="musicBtn" class="fab" aria-label="Music"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9a4.2 4.2 0 010 6M18.8 6.5a8 8 0 010 11"/></svg></button>

<!-- ===== FRONT PAGE (Smindex.html jaisa): video ka pehla frame cover hai, tap karte hi video + music shuru, 8 sec baad website. File: repo root me "intro.mp4". Koi text/symbol nahi ===== -->
<div id="env" role="button" tabindex="0" aria-label="Invitation kholein">
  <video id="introVideo" src="intro.mp4#t=0.1" playsinline preload="auto"></video>
</div>

<!-- Music file: repo root me "music.mp3" -->
<audio id="bgm" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>

<main>
  <!-- ===== Hero ===== -->
  <header class="hero" id="top">
    <div class="hero-in">
      <p class="hero-top" data-t="hero_top"></p>
      <h1 class="names"><span data-name="bride"></span><em>&amp;</em><span data-name="groom"></span></h1>

      <p class="hero-date" id="heroDate"></p>
      <div class="cd" id="cd">
        <div><b id="cdD">0</b><small data-t="cd_d"></small></div>
        <div><b id="cdH">00</b><small data-t="cd_h"></small></div>
        <div><b id="cdM">00</b><small data-t="cd_m"></small></div>
        <div><b id="cdS">00</b><small data-t="cd_s"></small></div>
      </div>
      <p class="cd-done" id="cdDone" hidden data-t="cd_done"></p>
      <a class="cue" href="#moments"><span data-t="cue"></span><br>⌄</a>
    </div>
  </header>

  <!-- ===== Photos: 4 rectangle + 3 circle windows ===== -->
  <section class="sec" id="moments">
    <p class="eyebrow rv" data-t="mom_eyebrow"></p>
    <h2 class="h2 rv" data-t="mom_title"></h2>
    <div class="orn rv">❀</div>
    <div class="rects" id="rects"></div>
    <div class="rounds" id="rounds"></div>
  </section>

  <!-- ===== Invitation ===== -->
  <section class="sec" id="invite">
    <article class="card rv">
      <p class="inv-head" data-t="inv_head"></p>
      <p data-t="inv_1"></p>
      <h3 class="big" data-name="groom"></h3>
      <p class="par" data-t="inv_gpar"></p>
      <p class="mid" data-t="inv_mid"></p>
      <h3 class="big" data-name="bride"></h3>
      <p class="par" data-t="inv_bpar"></p>
      <p data-t="inv_tail"></p>
      <div class="orn">❀</div>
      <p class="bless" data-t="inv_bless"></p>
    </article>
  </section>

  <!-- ===== Video: repo root me "video.mp4" ===== -->
  <section class="sec" id="film">
    <p class="eyebrow rv" data-t="film_eyebrow"></p>
    <h2 class="h2 rv" data-t="film_title"></h2>
    <div class="orn rv">❀</div>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const mk=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};

/* ============ Build photo frames ============ */
const EXT=['jpg','jpeg','png','webp','JPG','JPEG','PNG','WEBP'];
function loadImg(img,base){
  let i=0;img.src=base+'.'+EXT[0];
  img.onerror=()=>{i++;if(i<EXT.length){img.src=base+'.'+EXT[i]}else{img.onerror=null;img.parentElement.classList.add('missing')}};
}
function frame(base,cls,n){
  const f=mk(`<figure class="frame ${cls}"><img alt="Aarushi &amp; Ajeet photo ${n}" decoding="async"><span class="ph">❀<small>Photo ${n}</small></span></figure>`);
  const img=f.querySelector('img');loadImg(img,base);
  f.onclick=()=>{if(!f.classList.contains('missing'))openLb(img.currentSrc||img.src)};
  return f;
}
CONFIG.images.rect.forEach((b,i)=>{const c=mk('<div class="cell rv"></div>');c.style.setProperty('--d',(i*.12)+'s');c.append(frame(b,'rect',i+1));$('#rects').append(c)});
CONFIG.images.round.forEach((b,i)=>{const c=mk('<div class="r-wrap rv"></div>');c.style.setProperty('--d',(i*.15)+'s');c.append(frame(b,'round',CONFIG.images.rect.length+i+1));$('#rounds').append(c)});

/* ============ Apply language ============ */
function fmtDate(){return new Date(CONFIG.dateISO).toLocaleDateString(lang==='hi'?'hi-IN':'en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Kolkata'})}
function apply(){
  const R=document.documentElement;R.lang=lang==='hi'?'hi':'en';R.dataset.lang=lang;
  $$('[data-t]').forEach(e=>{const k=e.dataset.t;e.innerHTML=fill(I18N[lang][k]??I18N.hi[k]??'')});
  $$('[data-name]').forEach(e=>{e.textContent=pick(CONFIG.names[e.dataset.name])});
  $('#heroDate').textContent=$('#dDate').textContent=fmtDate();
  const loc=lang==='hi'?'hi-IN':'en-IN',dd=new Date(CONFIG.dateISO),tz={timeZone:'Asia/Kolkata'};
  $('#scrDate').textContent=dd.toLocaleDateString(loc,{day:'numeric',month:'long',year:'numeric',...tz});
  $('#scrDay').textContent=dd.toLocaleDateString(loc,{weekday:'long',...tz})+' • '+I18N[lang].scr_dayt;
  $('#dTime').textContent=CONFIG.time[lang];
  $('#dVenue').textContent=pick(CONFIG.venue);
  $('#hName').textContent=pick(CONFIG.host.name);$('#hAddr').textContent=pick(CONFIG.host.address);
  const ph=CONFIG.host.phone,a=$('#hPhone');a.textContent=ph;
  if(ph.replace(/\D/g,'').length>=8)a.href='tel:'+ph.replace(/[^\d+]/g,'');else a.removeAttribute('href');
  $$('.slide').forEach((s,i)=>{const g=GITA[i];s.querySelector('.gref').textContent=I18N[lang].gita_ref.replace('{c}',g.c).replace('{v}',g.v);s.querySelector('.gm').textContent=g.m[lang]});
  $$('[data-w]').forEach(p=>{p.textContent=WISHES[p.dataset.w][lang]});
  $('#langLbl').textContent={hi:'हिं',en:'EN',hn:'Hn'}[lang];
  const s=new Date(CONFIG.dateISO),e=new Date(s.getTime()+4*36e5),f=d=>d.toISOString().replace(/[-:]|\.\d{3}/g,'');
  $('#calBtn').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(fill(I18N[lang].cal_title))+'&dates='+f(s)+'/'+f(e)+'&location='+encodeURIComponent(pick(CONFIG.venue));
  $('#mapBtn').href=CONFIG.mapUrl||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(CONFIG.mapQuery||CONFIG.venue.en);
  $('#venueCard').href=$('#mapBtn').href;
  $('#waBtn').href='https://wa.me/'+(CONFIG.whatsapp||'').replace(/\D/g,'')+'?text='+encodeURIComponent(fill(I18N[lang].wa_msg));
  document.title=pick(CONFIG.names.bride)+' & '+pick(CONFIG.names.groom)+' | '+I18N[lang].hero_top.replace(/\|/g,'').trim();
  try{localStorage.setItem('lang',lang)}catch(e){}
}
$('#langBtn').onclick=()=>{
  lang=L[(L.indexOf(lang)+1)%L.length];
  const m=$('main');m.style.opacity=0;
  setTimeout(()=>{apply();m.style.opacity=1},200);
};
apply();

/* ============ Countdown ============ */
const T=new Date(CONFIG.dateISO).getTime();
function tick(){
  const d=Math.max(0,T-Date.now()),p=n=>String(n).padStart(2,'0');
  $('#cdD').textContent=Math.floor(d/864e5);$('#cdH').textContent=p(Math.floor(d/36e5)%24);
  $('#cdM').textContent=p(Math.floor(d/6e4)%60);$('#cdS').textContent=p(Math.floor(d/1e3)%60);
  $('#cd').hidden=d===0;$('#cdDone').hidden=d!==0;
}
tick();setInterval(tick,1000);

/* ============ Music + Front page ============ */
const bgm=$('#bgm'),mb=$('#musicBtn'),vid=$('#vid');
const IC_ON='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9a4.2 4.2 0 010 6M18.8 6.5a8 8 0 010 11"/></svg>',IC_OFF='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
function musicUI(on){mb.classList.toggle('on',on);mb.innerHTML=on?IC_ON:IC_OFF}
function startMusic(){bgm.muted=false;bgm.volume=.55;bgm.play().then(()=>musicUI(true)).catch(()=>musicUI(false))}
let userChoice=false;
mb.onclick=()=>{userChoice=true;if(bgm.paused){startMusic()}else{bgm.pause();musicUI(false)}};
bgm.querySelector('source').addEventListener('error',()=>{mb.style.display='none'});

const env=$('#env'),iv=$('#introVideo');let opened=false,tapped=false;
const INTRO_MS=8000;   /* front page par wait: exactly 8 sec. Badalna ho to sirf yahi number badlo */
function openInv(){
  if(opened)return;opened=true;
  env.classList.add('done');setTimeout(()=>env.remove(),1300);   /* video fade-out ke saath chalta rehta hai */
  document.body.classList.remove('lock');document.body.classList.add('go');
  scrollTo(0,0);
}
/* Front page (Smindex.html jaisa): tap = video + music shuru, theek 8 sec baad website. Video file ho ya na ho, turant redirect nahi hoga */
function tapOpen(){
  if(tapped)return;tapped=true;
  startMusic();
  setTimeout(openInv,INTRO_MS);
  iv.addEventListener('error',()=>env.classList.add('novid'));
  if(iv.error)env.classList.add('novid');
  iv.play().catch(()=>{});
}
env.addEventListener('click',tapOpen);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapOpen()}});
[...$('.hero-in').children].forEach((e,i)=>e.style.setProperty('--i',i));

/* Video: music pause/resume */
vid.querySelector('source').addEventListener('error',()=>$('#vbox').classList.add('missing'));
let resume=false;
vid.addEventListener('play',()=>{resume=!bgm.paused;if(resume){bgm.pause();musicUI(false)}});
const back=()=>{if(resume){resume=false;startMusic()}};
vid.addEventListener('pause',back);vid.addEventListener('ended',back);

/* ============ Scroll reveal ============ */
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12}):null;
$$('.rv').forEach(e=>io?io.observe(e):e.classList.add('in'));

/* ============ Scratch card (date reveal) ============ */
(function(){
  const box=$('#scratchBox'),cv=$('#scratchCv'),cx=cv.getContext('2d',{willReadFrequently:true});
  let down=false,last=null,moves=0,started=false,done=false;
  function paint(){
    const dpr=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect(),W=r.width,H=r.height;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cx.setTransform(dpr,0,0,dpr,0,0);
    cx.globalCompositeOperation='source-over';
    const g=cx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#ff5c9d');g.addColorStop(.35,'#ffc4dc');g.addColorStop(.62,'#ff8fbd');g.addColorStop(1,'#e8307a');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.strokeStyle='rgba(255,255,255,.2)';cx.lineWidth=9;
    for(let x=-H;x<W;x+=44){cx.beginPath();cx.moveTo(x,H);cx.lineTo(x+H,0);cx.stroke()}
    for(let i=0;i<150;i++){cx.fillStyle='rgba(255,255,255,'+(.15+Math.random()*.5)+')';cx.beginPath();cx.arc(Math.random()*W,Math.random()*H,.4+Math.random()*2,0,6.283);cx.fill()}
  }
  paint();
  addEventListener('resize',()=>{if(!started&&!done)paint()});
  function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
  function draw(e){
    if(!down||done)return;const p=pos(e);
    cx.globalCompositeOperation='destination-out';cx.strokeStyle='#000';cx.lineWidth=42;cx.lineCap='round';cx.lineJoin='round';
    cx.beginPath();cx.moveTo(last?last[0]:p[0],last?last[1]:p[1]);cx.lineTo(p[0],p[1]);cx.stroke();last=p;
    if(!started){started=true;box.classList.add('started')}
    if(++moves%5===0)check();
  }
  function check(){
    const d=cx.getImageData(0,0,cv.width,cv.height).data;let c=0,t=0;
    for(let i=3;i<d.length;i+=160){t++;if(d[i]<40)c++}
    if(c/t>.5)reveal();
  }
  function reveal(){if(done)return;done=true;box.classList.add('done');if(window.burst)window.burst()}
  cv.addEventListener('pointerdown',e=>{down=true;last=null;try{cv.setPointerCapture(e.pointerId)}catch(_){}draw(e)});
  cv.addEventListener('pointermove',draw);
  const up=()=>{down=false;last=null};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
})();

/* ============ Falling petals ============ */
(function(){
  window.burst=function(){};
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#petals'),x=c.getContext('2d');let W,H;
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight};size();addEventListener('resize',size);
  const cols=['255,170,205','255,214,232','255,255,255','255,120,175'],N=innerWidth<700?16:28;
  const mkp=init=>({x:Math.random()*W,y:init?Math.random()*H:-20,s:6+Math.random()*9,vy:.5+Math.random()*1,vx:-.3+Math.random()*.6,r:Math.random()*6.28,vr:(Math.random()-.5)*.03,sw:Math.random()*6.28,c:cols[Math.random()*cols.length|0],a:.5+Math.random()*.4,g:0});
  const P=Array.from({length:N},()=>mkp(true));
  window.burst=function(){for(let i=0;i<46;i++){const p=mkp(false);p.x=W/2+(Math.random()-.5)*W*.5;p.y=H*.45;p.vy=-2-Math.random()*5;p.vx=(Math.random()-.5)*6;p.g=.1;p.b=true;P.push(p)}};
  function draw(p){
    x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,.6+.4*Math.sin(p.sw));x.beginPath();
    x.moveTo(0,-p.s);x.bezierCurveTo(p.s,-p.s*.6,p.s*.8,p.s*.7,0,p.s);x.bezierCurveTo(-p.s*.8,p.s*.7,-p.s,-p.s*.6,0,-p.s);
    x.fillStyle='rgba('+p.c+','+p.a+')';x.fill();x.restore();
  }
  (function loop(){
    x.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=p.g;p.y+=p.vy;p.x+=p.vx+Math.sin(p.sw)*.4;p.r+=p.vr;p.sw+=.03;if(p.y>H+20){if(p.b){P.splice(i,1);continue}Object.assign(p,mkp(false))}draw(p)}
    requestAnimationFrame(loop);
  })();
})();
</script>
